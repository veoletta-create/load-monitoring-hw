# Telegraf configuration

[global_tags]

# Configuration for telegraf agent
[agent]
  ## Default data collection interval for all inputs
  interval = "60s"
  
  ## Rounds collection interval to 'interval'
  round_interval = true

  ## Telegraf will cache metric_buffer_limit metrics for each output
  metric_buffer_limit = 10000
  
  ## Flush the buffer whenever full
  flush_buffer_when_full = true

  ## Collection jitter is used to jitter the collection
  collection_jitter = "0s"

  ## Default flushing interval for all outputs
  flush_interval = "60s"
  
  ## Jitter the flush interval by a random amount
  flush_jitter = "0s"

  ## Run telegraf in debug mode
  debug = false
  
  ## Override default hostname
  hostname = ""


###############################################################################
#                                  OUTPUTS                                    #
###############################################################################

# Configuration for influxdb server to send metrics to
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "influx"
  precision = "s"
  timeout = "5s"


###############################################################################
#                                  INPUTS                                     #
###############################################################################

# Statsd Server (оставляем, так как он был в заготовке)
[[inputs.statsd]]
  protocol = "udp"
  max_tcp_connections = 250
  tcp_keep_alive = false
  service_address = ":8125"
  delete_gauges = true
  delete_counters = true
  delete_sets = true
  delete_timings = true
  percentiles = [90]
  metric_separator = "_"
  parse_data_dog_tags = false
  allowed_pending_messages = 10000
  percentile_limit = 1000

# Read metrics about cpu usage
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  fielddrop = ["time_*"]

# Get kernel statistics from /proc/stat
[[inputs.kernel]]

# Get the number of processes and group them by status
[[inputs.processes]]

# Read metrics about system load & uptime
[[inputs.system]]

[[inputs.interrupts]]

[[inputs.linux_sysctl_fs]]

# ---------------------------------------------------------

# Read metrics about memory usage (оперативная память)
[[inputs.mem]]

# Read metrics about swap memory usage (swap)
[[inputs.swap]]

# Read metrics about disk usage by mount point (жесткий диск)
[[inputs.disk]]
  mount_points = ["/"]

# Read metrics about network interface usage (сеть)
[[inputs.net]]